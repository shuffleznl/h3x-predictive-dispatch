name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dashboard validator dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Compile Python files
        run: python -m compileall custom_components tools
      - name: Validate HACS structure
        run: python tools/validate_hacs_structure.py
      - name: Validate H3X Bridge contract
        run: python tools/validate_bridge_contract.py
      - name: Validate sensor metadata
        run: python tools/validate_sensor_metadata.py
      - name: Validate periodic full-charge wiring
        run: python tools/validate_periodic_full_charge.py
      - name: Validate runtime control entities
        run: python tools/validate_control_entities.py
      - name: Validate solar self-consumption wiring
        run: python tools/validate_solar_self_consumption.py
      - name: Simulate predictive dispatch
        run: python tools/validate_predictive_dispatch.py
      - name: Validate predictive dashboard namespace
        run: python tools/validate_predictive_dashboard.py
      - name: Validate Shelly and SMA entity discovery
        run: python tools/validate_shelly_meter.py
      - name: Validate JSON
        run: |
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/h3x_predictive_dispatch/manifest.json > /dev/null
          python -m json.tool custom_components/h3x_predictive_dispatch/strings.json > /dev/null
          python -m json.tool custom_components/h3x_predictive_dispatch/translations/en.json > /dev/null
