title: H3X Predictive Dispatch
views:
  - title: Predictive dispatch
    path: h3x-predictive-dispatch
    icon: mdi:battery-charging-70
    cards:
      - type: markdown
        title: H3X Predictive Dispatch
        content: |
          {% set plan_entity = 'sensor.pylontech_h3x_predictive_dispatch_price_plan' %}
          {% set decision = states('sensor.pylontech_h3x_predictive_dispatch_decision') %}
          {% set reason = states('sensor.pylontech_h3x_predictive_dispatch_decision_reason') %}
          {% set price = states('sensor.pylontech_h3x_predictive_dispatch_current_price') %}
          {% set value = states('sensor.pylontech_h3x_predictive_dispatch_estimated_savings') %}
          {% set today_value = states('sensor.pylontech_h3x_predictive_dispatch_estimated_savings_today') %}
          {% set currency = state_attr(plan_entity, 'currency') or 'EUR' %}
          {% set load_source = state_attr('sensor.pylontech_h3x_predictive_dispatch_decision', 'home_load_power_source') %}
          {% set solar_source = state_attr('sensor.pylontech_h3x_predictive_dispatch_decision', 'solar_forecast_source') %}

          **Decision:** {{ decision if decision not in ['unknown', 'unavailable', 'none', 'None', ''] else 'waiting for optimizer data' }}

          **Reason:** {{ reason if reason not in ['unknown', 'unavailable', 'none', 'None', ''] else 'not available yet' }}

          **Current price:** {% if price not in ['unknown', 'unavailable', 'none', 'None', ''] %}{{ price }} {{ currency }}/kWh{% else %}waiting for Nord Pool price data{% endif %}

          **Economic outlook:** {% if value not in ['unknown', 'unavailable', 'none', 'None', ''] %}{{ value }} {{ currency }} expected savings over the active horizon / {{ today_value }} {{ currency }} today{% else %}waiting for price, SOC, capacity, and forecast data{% endif %}

          **Forecast inputs:** {{ load_source or 'load source unavailable' }}; {{ solar_source or 'solar forecast unavailable' }}

          The schedule is recalculated every five minutes. Forecast uncertainty, conversion losses, battery wear, minimum action duration, Dutch tax/VAT, and grid limits are included before a command is issued.

