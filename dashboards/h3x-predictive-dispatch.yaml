      - type: markdown
        title: Planned actions
        content: |
          {% set plan_entity = 'sensor.pylontech_h3x_predictive_dispatch_price_plan' %}
          {% set currency = state_attr(plan_entity, 'currency') or 'EUR' %}
          | Slot | When | Price | Power | Energy | Source/effect | Value |
          |---|---|---:|---:|---:|---|---:|
          {% for item in [
            ('Charge', 'sensor.pylontech_h3x_predictive_dispatch_next_charge_slot'),
            ('Discharge', 'sensor.pylontech_h3x_predictive_dispatch_next_discharge_slot'),
            ('Full charge', 'sensor.pylontech_h3x_predictive_dispatch_periodic_full_charge_slot')
          ] %}
          {% set entity_id = item[1] %}
          {% set raw = states(entity_id) %}
          {% set when = raw[5:16] | replace('T', ' ') if raw[:4] | int(0) > 2000 else raw | replace('_', ' ') %}
          {% set price = state_attr(entity_id, 'price') %}
          {% set power_w = state_attr(entity_id, 'target_power_w') %}
          {% set energy = state_attr(entity_id, 'energy_kwh') %}
          {% set value = state_attr(entity_id, 'value') %}
          {% set grid_charge = state_attr(entity_id, 'grid_charge_kwh') %}
          {% set solar_charge = state_attr(entity_id, 'solar_charge_kwh') %}
          {% set self_use = state_attr(entity_id, 'self_consumption_kwh') %}
          {% set export = state_attr(entity_id, 'battery_export_kwh') %}
          {% set price_value = (price | float(0)) | round(3) %}
          {% set power_value = ((power_w | float(0)) / 1000) | round(1) %}
          {% set energy_value = (energy | float(0)) | round(2) %}
          {% set value_value = (value | float(0)) | round(2) %}
          {% set price_text = price_value ~ ' ' ~ currency ~ '/kWh' if price is not none else '-' %}
          {% set power_text = power_value ~ ' kW' if power_w is not none else '-' %}
          {% set energy_text = energy_value ~ ' kWh' if energy is not none else '-' %}
          {% set value_text = value_value ~ ' ' ~ currency if value is not none else '-' %}
          {% if item[0] == 'Charge' %}
          {% set solar_kwh = (solar_charge | float(0)) | round(2) %}
          {% set grid_kwh = (grid_charge | float(0)) | round(2) %}
          {% set split = solar_kwh ~ ' solar / ' ~ grid_kwh ~ ' grid kWh' if solar_charge is not none or grid_charge is not none else '-' %}
          {% elif item[0] == 'Discharge' %}
          {% set self_kwh = (self_use | float(0)) | round(2) %}
          {% set export_kwh = (export | float(0)) | round(2) %}
          {% set split = self_kwh ~ ' self / ' ~ export_kwh ~ ' export kWh' if self_use is not none or export is not none else '-' %}
          {% else %}
          {% set split = 'periodic top-balance target' %}
          {% endif %}
          | {{ item[0] }} | {{ when if when not in ['unknown', 'unavailable', 'none', 'None', ''] else 'not planned' }} | {{ price_text }} | {{ power_text }} | {{ energy_text }} | {{ split }} | {{ value_text }} |
          {% endfor %}

          {% set plan = state_attr(plan_entity, 'dispatch_plan') or [] %}
          {% set actionable = plan | selectattr('action', 'ne', 'idle') | list %}
          {% if actionable | count > 0 %}
          **Upcoming optimizer actions**

          Idle diagnostic rows are hidden. Planned values can change whenever prices, SOC, load, PV forecast, or grid-limit readings update.

          | Start | Intent | Buy / sell | Power | Energy | Source/effect | Confidence | Value |
          |---|---|---:|---:|---:|---|---:|---:|
          {% for slot in actionable[:10] %}
          {% set start = (slot.start | default('-'))[5:16] | replace('T', ' ') %}
          {% set intent = (slot.intent | default(slot.action) | replace('_', ' ')) | title %}
          {% set buy_value = (slot.buy_price | default(slot.price) | float(0)) | round(3) %}
          {% set sell_value = (slot.sell_price | default(slot.price) | float(0)) | round(3) %}
          {% set power_value = ((slot.target_power_w | default(0) | float(0)) / 1000) | round(1) %}
          {% set energy_value = (slot.energy_kwh | default(0) | float(0)) | round(2) %}
          {% set value_value = (slot.value | default(0) | float(0)) | round(2) %}
          {% set price_text = buy_value ~ ' / ' ~ sell_value %}
          {% set power_text = power_value ~ ' kW' %}
          {% set energy_text = energy_value ~ ' kWh' %}
          {% set value_text = value_value ~ ' ' ~ currency %}
          {% set confidence = ((slot.forecast_confidence | default(0) | float(0)) * 100) | round(0) %}
          {% if slot.action == 'charge' %}
          {% set solar_kwh = (slot.solar_charge_kwh | default(0) | float(0)) | round(2) %}
          {% set grid_kwh = (slot.grid_charge_kwh | default(0) | float(0)) | round(2) %}
          {% set split = solar_kwh ~ ' solar / ' ~ grid_kwh ~ ' grid kWh' %}
          {% elif slot.action == 'discharge' %}
          {% set self_kwh = (slot.self_consumption_kwh | default(0) | float(0)) | round(2) %}
          {% set export_kwh = (slot.battery_export_kwh | default(0) | float(0)) | round(2) %}
          {% set split = self_kwh ~ ' self / ' ~ export_kwh ~ ' export kWh' %}
          {% else %}
          {% set split = '-' %}
          {% endif %}
          | {{ start }} | {{ intent }} | {{ price_text }} | {{ power_text }} | {{ energy_text }} | {{ split }} | {{ confidence }}% | {{ value_text }} |
          {% endfor %}
          {% if actionable | count > 10 %}
          Showing the first 10 of {{ actionable | count }} planned charge/discharge rows.
          {% endif %}
          {% else %}
          No charge or discharge rows are currently planned. The optimizer is holding idle for the visible horizon.
          {% endif %}

      - type: custom:apexcharts-card
        graph_span: 36h
        span:
          start: hour
        now:
          show: true
          label: Now
        header:
          show: true
          title: Dynamic price and actionable dispatch
          show_states: true
          colorize_states: true
        yaxis:
          - id: price
            decimals: 3
            apex_config:
              title:
                text: Price/kWh
          - id: power
            opposite: true
            decimals: 1
            apex_config:
              title:
                text: Battery kW
        apex_config:
          chart:
            height: 360
          stroke:
            width: 2
          tooltip:
            shared: true
          legend:
            show: true
        series:
          - entity: sensor.pylontech_h3x_predictive_dispatch_price_plan
            name: Price
            yaxis_id: price
            type: line
            curve: stepline
            color: "#1f77b4"
            data_generator: |
              const slots = entity.attributes.price_slots || [];
              return slots.flatMap((slot) => {
                const start = new Date(slot.start).getTime();
                const end = new Date(slot.end).getTime();
                const price = Number(slot.price);
                if (!Number.isFinite(start) || !Number.isFinite(end) || !Number.isFinite(price)) return [];
                return [[start, price], [end, price]];
              });
          - entity: sensor.pylontech_h3x_predictive_dispatch_price_plan
            name: Trend
            yaxis_id: price
            type: line
            curve: smooth
            color: "#d62728"
            data_generator: |
              const trend = entity.attributes.price_trend || [];
              return trend.map((slot) => {
                const start = new Date(slot.start).getTime();
                const price = Number(slot.trend_price);
                if (!Number.isFinite(start) || !Number.isFinite(price)) return null;
                return [start, price];
              }).filter(Boolean);
          - entity: sensor.pylontech_h3x_predictive_dispatch_price_plan
            name: Planned dispatch
            yaxis_id: power
            type: area
            curve: stepline
            color: "#2ca02c"
            opacity: 0.25
            data_generator: |
              const plan = (entity.attributes.dispatch_plan || [])
                .filter((slot) => slot.action === "charge" || slot.action === "discharge");
              return plan.flatMap((slot) => {
                const start = new Date(slot.start).getTime();
                const end = new Date(slot.end).getTime();
                const kw = Number(slot.target_power_w || 0) / 1000;
                if (!Number.isFinite(start) || !Number.isFinite(end) || !Number.isFinite(kw)) return [];
                const signedKw = slot.action === "charge" ? -kw : kw;
                return [[start, signedKw], [end, signedKw]];
              });

      - type: custom:apexcharts-card
        graph_span: 36h
        span:
          start: hour
        now:
          show: true
          label: Now
        header:
          show: true
          title: Load, solar, and net-grid forecast
          show_states: true
          colorize_states: true
        yaxis:
          - id: power
            decimals: 1
            apex_config:
              title:
                text: kW
        apex_config:
          chart:
            height: 340
          stroke:
            width: 2
          tooltip:
            shared: true
          legend:
            show: true
        series:
          - entity: sensor.pylontech_h3x_predictive_dispatch_price_plan
            name: Load p10
            yaxis_id: power
            type: line
            curve: smooth
            color: "#bdbdbd"
            stroke_width: 1
            opacity: 0.55
            data_generator: |
              const forecast = entity.attributes.load_forecast || [];
              return forecast.map((slot) => {
                const start = new Date(slot.start).getTime();
                const kw = Number(slot.p10_w || 0) / 1000;
                return Number.isFinite(start) && Number.isFinite(kw) ? [start, kw] : null;
              }).filter(Boolean);
          - entity: sensor.pylontech_h3x_predictive_dispatch_price_plan
            name: Forecast load
            yaxis_id: power
            type: line
            curve: stepline
            color: "#7f7f7f"
            data_generator: |
              const forecast = entity.attributes.load_forecast || [];
              return forecast.flatMap((slot) => {
                const start = new Date(slot.start).getTime();
                const end = new Date(slot.end).getTime();
                const kw = Number(slot.power_w || 0) / 1000;
                if (!Number.isFinite(start) || !Number.isFinite(end) || !Number.isFinite(kw)) return [];
                return [[start, kw], [end, kw]];
              });
          - entity: sensor.pylontech_h3x_predictive_dispatch_price_plan
            name: Load p90
            yaxis_id: power
            type: line
            curve: smooth
            color: "#616161"
            stroke_width: 1
            opacity: 0.65
            data_generator: |
              const forecast = entity.attributes.load_forecast || [];
              return forecast.map((slot) => {
                const start = new Date(slot.start).getTime();
                const kw = Number(slot.p90_w || 0) / 1000;
                return Number.isFinite(start) && Number.isFinite(kw) ? [start, kw] : null;
              }).filter(Boolean);
          - entity: sensor.pylontech_h3x_predictive_dispatch_price_plan
            name: Forecast solar
            yaxis_id: power
            type: area
            curve: smooth
            color: "#ffbf00"
            opacity: 0.25
            data_generator: |
              const forecast = entity.attributes.solar_forecast || [];
              return forecast.map((slot) => {
                const start = new Date(slot.start).getTime();
                const kw = Number(slot.power_w || 0) / 1000;
                if (!Number.isFinite(start) || !Number.isFinite(kw)) return null;
                return [start, kw];
              }).filter(Boolean);
          - entity: sensor.pylontech_h3x_predictive_dispatch_price_plan
            name: Net grid without battery
            yaxis_id: power
            type: line
            curve: stepline
            color: "#d62728"
            data_generator: |
              const plan = entity.attributes.dispatch_plan || [];
              return plan.flatMap((slot) => {
                const start = new Date(slot.start).getTime();
                const end = new Date(slot.end).getTime();
                const kw = Number(slot.net_grid_without_battery_w || 0) / 1000;
                if (!Number.isFinite(start) || !Number.isFinite(end) || !Number.isFinite(kw)) return [];
                return [[start, kw], [end, kw]];
              });
          - entity: sensor.pylontech_h3x_predictive_dispatch_price_plan
            name: Net grid with battery
            yaxis_id: power
            type: line
            curve: stepline
            color: "#2ca02c"
            data_generator: |
              const plan = entity.attributes.dispatch_plan || [];
              return plan.flatMap((slot) => {
                const start = new Date(slot.start).getTime();
                const end = new Date(slot.end).getTime();
                const kw = Number(slot.net_grid_with_battery_w || 0) / 1000;
                if (!Number.isFinite(start) || !Number.isFinite(end) || !Number.isFinite(kw)) return [];
                return [[start, kw], [end, kw]];
              });

      - type: custom:apexcharts-card
        graph_span: 24h
        header:
          show: true
          title: Battery power and SOC
          show_states: true
          colorize_states: true
        yaxis:
          - id: power
            decimals: 1
            apex_config:
              title:
                text: kW
          - id: soc
            opposite: true
            min: 0
            max: 100
            decimals: 0
            apex_config:
              title:
                text: SOC %
        apex_config:
          chart:
            height: 340
          tooltip:
            shared: true
        series:
          - entity: sensor.pylontech_h3x_bridge_battery_power
            name: Battery power
            yaxis_id: power
            type: area
            color: "#ff7f0e"
            opacity: 0.2
            transform: return Number(x) / 1000;
            group_by:
              func: avg
              duration: 5min
          - entity: sensor.pylontech_h3x_bridge_battery_soc
            name: SOC
            yaxis_id: soc
            type: line
            color: "#9467bd"
            group_by:
              func: avg
              duration: 5min

      - type: custom:apexcharts-card
        graph_span: 7d
