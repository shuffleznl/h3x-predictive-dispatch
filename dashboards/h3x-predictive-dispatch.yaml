          stroke:
            width: 2
          tooltip:
            shared: true
        series:
          - entity: sensor.pylontech_h3x_bridge_battery_soc
            name: SOC
            yaxis_id: soc
            type: line
            color: "#9467bd"
            group_by:
              func: avg
              duration: 15min

